# Push a tag like v2.1.0 to build, test and attach both executables to a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Engine tests
        run: dotnet run -c Release --project tests/EngineTests
      - name: Publish (needs .NET Desktop Runtime)
        run: dotnet publish ClaudeSync.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o out/small
      - name: Publish (portable)
        run: dotnet publish ClaudeSync.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o out/portable
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory release | Out-Null
          Copy-Item out/small/ClaudeSync.exe release/ClaudeSync.exe
          Copy-Item out/portable/ClaudeSync.exe release/ClaudeSync-portable.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
